name: Job Search Pipeline

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the every-other-day gap check (useful for manual testing)"
        type: boolean
        default: false
  # Runs daily; main.py self-checks that at least MIN_DAYS_BETWEEN_RUNS
  # (2) have elapsed since the last successful run, so this yields a true
  # "every other day" cadence without the day-of-month reset problems of
  # `*/2` cron syntax. 07:00 UTC.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write
  issues: write

jobs:
  run-job-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m job_search.main --post-issue ${{ inputs.force && '--force' || '' }}

      - name: Commit updated state and report
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_jobs.json data/applications.json reports/
          git diff --cached --quiet || git commit -m "Job search run $(date -u +%Y-%m-%d)"
          git push

